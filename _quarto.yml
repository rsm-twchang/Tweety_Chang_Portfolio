project:
  type: website
  output-dir: docs
  # Home page (index.html), assets, and redirect stubs are hand-written and copied as-is.
  resources:
    - index.html
    - about.html
    - projects.html
    - assets/
    - figures/
    - favicon.svg
  render:
    - "*.qmd"
    - "!resume.qmd"

execute:
  freeze: auto   # re-run code only when a page's source changes
  echo: false
  warning: false
  message: false

website:
  title: "Tweety Chang"
  site-url: "https://rsm-twchang.github.io/Tweety_Chang_Portfolio/"
  favicon: favicon.svg
  open-graph: true
  twitter-card: true
  search: false
  page-navigation: false
  navbar:
    title: "Tweety Chang"
    logo-href: index.html
    right:
      - href: index.html#home
        text: Home
      - href: index.html#about
        text: About
      - href: index.html#projects
        text: Projects
      - href: index.html#experience
        text: Experience
      - href: index.html#contact
        text: Contact
  page-footer:
    left: "© 2026 Tweety Chang"
    right: "[Back to all projects](index.html#projects)"

format:
  html:
    theme:
      light: [cosmo, theme.scss]
    css: styles.css
    toc: true
    toc-title: "On this page"
    smooth-scroll: true
    html-math-method: mathjax
    title-block-categories: false
